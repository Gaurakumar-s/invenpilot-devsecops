# InvenPilot local stack: PostgreSQL + FastAPI backend + React/Nginx frontend
# Run:  docker compose up --build      Open: http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    container_name: invenpilot-postgres
    environment:
      POSTGRES_DB: invenpilot
      POSTGRES_USER: invenpilot
      POSTGRES_PASSWORD: invenpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenpilot -d invenpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: invenpilot-backend:local
    container_name: invenpilot-backend
    environment:
      APP_NAME: InvenPilot API
      DATABASE_URL: postgresql+psycopg://invenpilot:invenpilot@postgres:5432/invenpilot
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: invenpilot-frontend:local
    container_name: invenpilot-frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
