apiVersion: v1
kind: Secret
metadata:
  name: invenpilot-db
  labels:
    {{- include "invenpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "invenpilot.databaseUrl" . | quote }}
