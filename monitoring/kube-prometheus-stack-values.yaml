# Helm values for prometheus-community/kube-prometheus-stack
# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors from every namespace, not only those with the release label
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: 500m, memory: 1Gi}

grafana:
  enabled: true
  adminUser: admin
  adminPassword: stockpilot-admin   # demo only
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: /tmp/dashboards
  defaultDashboardsEnabled: true

alertmanager:
  enabled: false

# Keep the demo cluster light
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
